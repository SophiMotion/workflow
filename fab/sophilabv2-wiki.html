const classes=[{"id": "unnc2025", "name": "UNNC FabLab · 2025", "short": "UNNC · 2025", "year": "2025", "url": "https://sophigo.com/docs/courses/fab-course/class/fab-2025-UNNC.html", "intro": "从嵌入式开发、电子与CAD，到数字制造、智能载具测试和综合项目展示。", "note": "公开班级页面提供课程进度，未列出个人作品名册。可从课程档案继续了解学习过程。", "teams": []}, {"id": "zwu2024", "name": "ZWU · 2024", "short": "ZWU · 2024", "year": "2024", "url": "https://sophigo.com/docs/courses/fab-course/class/fab-2024-zwu-Interactivesystem.html", "intro": "以交互系统为主线，连接项目管理、Arduino、界面、材料、CAD与数字制造。", "note": "公开班级档案以团队为单位收录作品；这里保留原团队名称与入口。", "teams": [{"id": "24-0", "name": "SZPJNF", "url": "https://nexmaker-fab.github.io/2024ZWU-IS-1/#/", "students": []}, {"id": "24-1", "name": "Ecobloom", "url": "https://nexmaker-fab.github.io/2024ZWU-IS-2-Ecobloom/#/", "students": []}, {"id": "24-2", "name": "Yes or Yes", "url": "https://nexmaker-fab.github.io/2024ZWU-IS-3-Yes-or-yes/#/", "students": []}, {"id": "24-3", "name": "watermelon sugar", "url": "https://nexmaker-fab.github.io/2024ZWU-IS-4/#/", "students": []}, {"id": "24-4", "name": "BCZG", "url": "https://nexmaker-fab.github.io/2024ZWU-IS-5/#/", "students": []}, {"id": "24-5", "name": "None group", "url": "https://nexmaker-fab.github.io/2024ZWU-IS-6/#/", "students": []}]}, {"id": "zwu2026", "name": "ZWU · 2026", "short": "ZWU · 2026", "year": "2026", "url": "https://sophigo.com/docs/courses/fab-course/class/FAB-2026-ZWU-01.html", "intro": "从网页记录、开源硬件与交互程序，走向数字制造和综合项目。", "note": "班级与团队来源已核对。学生使用原站公开姓名或昵称，个人页面保留在作者原站。", "teams": [{"id": "26-0", "name": "这是啥组", "url": "https://nexmaker-fab.github.io/zwu2026-1-001/", "students": [{"id": "s26-0-0", "name": "陈过", "url": "https://clare9901.github.io/Clare111111111new/"}, {"id": "s26-0-1", "name": "蔡奥秘", "url": "https://mtttttt12.github.io/Cai-aomi/"}, {"id": "s26-0-2", "name": "蔡仪彤", "url": "https://2024014735caiyitong.github.io/Cai-Yitong/"}, {"id": "s26-0-3", "name": "王昱涵", "url": "https://2024014747.github.io/wyh-web/"}]}, {"id": "26-1", "name": "Jowywlz", " const content=document.getElementById('wiki-content'),tree=document.getElementById('wiki-tree');
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arrow='<svg class="arrow" aria-hidden="true"><use href="#arr"/></svg>',ext='<svg class="arrow" aria-hidden="true"><use href="#ext"/></svg>';
const colorRule='<div class="color-rule" aria-hidden="true"><i></i><i></i><i></i><i></i></div>';
const steps=[['问题与场景','从真实场景出发，明确对象、需求与研究问题。'],['设计与制作','读懂模型、结构、程序与制造过程，理解每一次选择。'],['测试与改进','检查数据、失败与迭代，区分演示和经过验证的结论。'],['文档与表达','沿着源文件、引用与个人记录，复现过程并继续研究。']];
function stepHTML(){return '<div class="wiki-steps">'+steps.map((s,i)=>`<div class="wiki-step"><b>0${i+1}</b><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('')+'</div>'}
function renderTree(query=''){
 const q=query.trim().toLowerCase();let count=0;
 tree.innerHTML=classes.map(c=>{const classMatch=(c.name+c.short).toLowerCase().includes(q);const kids=c.teams.map(t=>{const teamMatch=t.name.toLowerCase().includes(q);const ss=t.students.filter(s=>!q||classMatch||teamMatch||s.name.toLowerCase().includes(q));if(q&&!classMatch&&!teamMatch&&!ss.length)return '';return `<a href="#team=${t.id}" data-route="team=${t.id}">${E(t.name)}</a>`+ss.map(s=>`<a class="student-link" href="#student=${s.id}" data-route="student=${s.id}">${E(s.name)}</a>`).join('')}).join('');if(q&&!classMatch&&!kids)return '';count++;return `<details class="wiki-group" data-class="${c.id}" ${q?'open':''}><summary>${E(c.short)}</summary><a href="#class=${c.id}" data-route="class=${c.id}">班级介绍</a>${kids||'<div class="wiki-subtitle">原档案暂未列个人名册</div>'}</details>`}).join('');document.getElementById('wiki-empty').hidden=count>0;markRoute();
}
function markRoute(){const route=location.hash.slice(1)||'intro';document.querySelectorAll('[data-route]').forEach(a=>{if(a.dataset.route===route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});const active=tree.querySelector('[aria-current=page]');if(active)active.closest('details').open=true;}
function link(url,label){return `<a class="button" href="${E(url)}" target="_blank" rel="noopener">${label} ${ext}</a>`}
function breadcrumbs(c,t){return `<nav class="breadcrumb" aria-label="面包屑"><a href="#intro">作品介绍</a><span>/</span><a href="#class=${c.id}">${E(c.short)}</a>${t?`<span>/</span><a href="#team=${t.id}">${E(t.name)}</a>`:''}</nav>`}
function studentLinks(t){return t.students.map(s=>`<a class="student-card" href="#student=${s.id}"><strong>${E(s.name)}</strong><small>${E(t.name)} · 个人作品入口</small></a>`).join('')}
function intro(){return `<section class="wiki-home-intro"><h1>让每一次制作，<br>留下可以继续的知识。</h1><p class="wiki-lead">从班级进入，沿着学生的研究记录，看见问题、设计、制作与验证。</p>${colorRule}</section><section class="wiki-section"><h2>在这里，读懂一件作品。</h2>${stepHTML()}</section><section class="wiki-section"><h2>从一个班级开始。</h2>${classes.map(c=>`<a class="class-row" href="#class=${c.id}"><span class="class-year">${c.year}</span><div><h3>${E(c.name)}</h3><p>${E(c.intro)}</p></div>${arrow}</a>`).join('')}</section><p class="wiki-caption">收录SophiGo公开课程档案，用作学习参考。原始作品由作者维护；课程作品不等于本项目竞赛获奖成果。</p>`}
function classPage(c){return `${breadcrumbs(c)}<h1>${E(c.name)}</h1><p class="wiki-lead">${E(c.intro)}</p>${colorRule}<div class="actions page-actions">${link(c.url,'阅读原始班级档案')}</div><p class="record-note">${E(c.note)}</p>${c.teams.length?`<section class="wiki-section"><h2>团队与项目记录</h2><div class="record-grid">${c.teams.map(t=>`<article class="record"><h3>${E(t.name)}</h3><p>${t.students.length?'已收录 '+t.students.length+' 位公开学生作品入口。':'从原团队站点阅读项目与学习记录。'}</p><a href="#team=${t.id}">进入团队档案 ${arrow}</a></article>`).join('')}</div></section>`:''}${c.teams.some(t=>t.students.length)?`<section class="wiki-section"><h2>学生作品</h2><div class="student-grid">${c.teams.map(studentLinks).join('')}</div></section>`:''}<section class="wiki-section"><h2>阅读作品的四个角度</h2>${stepHTML()}</section>`}
function teamPage(c,t){return `${breadcrumbs(c)}<h1>${E(t.name)}</h1><p class="wiki-lead">${E(c.name)} · 团队作品与过程记录</p>${colorRule}<div class="actions page-actions">${link(t.url,'打开团队作品站')}<a class="button secondary" href="#class=${c.id}">返回班级</a></div>${t.students.length?`<section class="wiki-section"><h2>学生作品</h2><div class="student-grid">${studentLinks(t)}</div></section>`:'<p class="record-note">当前索引保留团队入口，未核实的个人名册不作补写。请在原站查看作者发布的最新内容。</p>'}<section class="wiki-section"><h2>沿着过程，理解团队的作品。</h2>${stepHTML()}</section><p class="wiki-caption">名称与链接来自公开课程、团队页面；这里不迁移作者的作品正文或评分记录。</p>`}
function studentPage(c,t,s){return `${breadcrumbs(c,t)}<h1>${E(s.name)}</h1><p class="wiki-lead">${E(c.name)} · ${E(t.name)} · 学生作品档案</p>${colorRule}<div class="actions page-actions">${link(s.url,'阅读个人作品')}<a class="button secondary" href="#team=${t.id}">查看所在团队</a></div><section class="wiki-section"><h2>从个人记录里，看见学习过程。</h2><p class="muted">这个入口指向作者公开的个人站点。具体作品、进度与内容，以作者页面为准。</p>${stepHTML()}</section><p class="wiki-caption">来源：<a href="${E(t.url)}" target="_blank" rel="noopener">${E(t.name)}公开团队档案</a>。保留作者使用的姓名或昵称，不展示学号和无关个人信息。</p>`}
function render(){const route=location.hash.slice(1)||'intro';let markup='';if(route==='intro')markup=intro();else for(const c of classes){if(route==='class='+c.id)markup=classPage(c);for(const t of c.teams){if(route==='team='+t.id)markup=teamPage(c,t);for(const s of t.students)if(route==='student='+s.id)markup=studentPage(c,t,s);}}content.innerHTML=markup||'<h1>未找到这份档案</h1><p class="wiki-lead">请从左侧班级或学生目录继续浏览。</p><a class="button page-actions" href="#intro">返回作品介绍</a>';markRoute();document.getElementById('wiki-sidebar').classList.remove('open');const b=document.querySelector('.wiki-mobile-toggle');b.setAttribute('aria-expanded','false');b.querySelector('span').textContent='展开';}
renderTree();render();window.addEventListener('hashchange',()=>{render();content.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})});document.getElementById('wiki-search').addEventListener('input',e=>renderTree(e.target.value));document.querySelector('.wiki-mobile-toggle').addEventListener('click',e=>{const b=e.currentTarget,o=document.getElementById('wiki-sidebar').classList.toggle('open');b.setAttribute('aria-expanded',o);b.querySelector('span').textContent=o?'收起':'展开'});
</script></body></html>
