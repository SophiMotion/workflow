<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkateChassis</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f5;color:#242924;font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}small{font-size:11px;color:#737b70;letter-spacing:.04em}h1{font-size:27px;letter-spacing:-1px;margin:6px 0}p{color:#60685c}hr{border:0;border-top:1px solid #dfe4da;margin:22px 0}dl{margin:16px 0}dl div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #e3e7df}dt{color:#687260}dd{margin:0;font-weight:600;text-align:right}button{display:block;width:100%;padding:12px;margin:9px 0;border-radius:8px;border:1px solid #d6dece;background:#fff;color:#263021;font:inherit;cursor:pointer}button.primary{background:#262d24;color:white;border-color:#262d24}button:disabled{opacity:.4;cursor:default}#message{padding:12px;background:#edf2e3;border-left:3px solid #a2b36a;overflow-wrap:anywhere;color:#3e4a32}.fine{font-size:11px;color:#7c8276}#parts{max-height:125px;overflow:auto;padding-left:18px;font-size:11px;color:#737b70}</style></head><body>
<small>SOPHISTUDIO / FUSION</small><h1>SkateChassis</h1><p>把当前配置，变成可编辑的工程模型。</p><div id="message" role="status">正在连接插件…</div>
<dl id="summary"></dl><button onclick="send('import')">导入配置 JSON</button><button id="generate" class="primary" disabled onclick="send('generate')">生成新模型</button><button id="save" disabled onclick="send('save')">保存 F3D</button><hr><small>当前组件</small><ul id="parts"></ul><p class="fine">生成操作会创建新文档。已有设计和手工修改保留在原文档中。主尺寸可在 Fusion「修改 → 更改参数」中编辑。</p><p class="fine">概念装配；孔位、公差、材料与运动学需进一步工程设计。</p>
<script>
function send(action){if(window.adsk)window.adsk.fusionSendData(action,'{}');}
window.fusionJavaScriptHandler={handle:function(action,data){if(action!=='state')return 'OK';const s=JSON.parse(data),p=s.payload,c=p&&p.config;document.getElementById('message').textContent=s.message;document.getElementById('generate').disabled=!c||s.busy;document.getElementById('save').disabled=!s.hasModel||s.busy;document.querySelector('button').disabled=s.busy;const dl=document.getElementById('summary');dl.replaceChildren();if(c){[['配置修订','rev. '+(p.project?.revision??0)],['底盘',c.length+' × '+c.width+' mm'],['立柱 / 轮径',c.mast+' / '+c.wheel+' mm'],['上肢',c.arm==='none'?'无双臂':c.arm==='dual12'?'双臂共 12 轴':'双臂共 6 轴'],['零件数量',p.bodies.length+' 个']].forEach(([k,v])=>{const row=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;row.append(dt,dd);dl.append(row);});}const list=document.getElementById('parts');list.replaceChildren();(p?.bodies||[]).forEach(b=>{const li=document.createElement('li');li.textContent=b.id;list.append(li);});return 'OK';}};
window.addEventListener('load',()=>send('ready'));
</script></body></html>
