name: Welding artifact checks
on:
  push:
    paths: ['weld/**', '.github/workflows/weld-check.yml']
  pull_request:
    paths: ['weld/**', '.github/workflows/weld-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weld
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: weld/package-lock.json
      - run: npm ci
      - run: npm test
