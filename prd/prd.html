<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目驾驶舱 · SophiStudio</title>
  <meta name="description" content="面向驾驶模拟器与线控底盘的 PRD/SOW 一体化项目管理驾驶舱。">
  <meta name="theme-color" content="#f8f9fa">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 3L22 10L14 15L6 12Z' fill='%231a73e8'/%3E%3Cpath d='M14 15L26 20L9 29L14 21Z' fill='%23fbbc04'/%3E%3Cpath d='M6 12L14 15L14 21L6 18Z' fill='%2334a853'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="prd.css?v=20260902-1">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M9.5 20v-6h5v6"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M13 14h3M8 17h3"/></symbol>
    <symbol id="i-team" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3.5 20v-2.5A4.5 4.5 0 0 1 8 13h2a4.5 4.5 0 0 1 4.5 4.5V20M15 14h1.5a4 4 0 0 1 4 4v2"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="m4 7 8-4 8 4v10l-8 4-8-4Z"/><path d="m4 7 8 4 8-4M12 11v10"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m7.5 12 3 3 6-7"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2.7 20h18.6Z"/><path d="M12 9v5M12 17.5v.1"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 16v4h16v-4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12m0 0-5-5m5 5 5-5M4 20h16"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 8V3h10v5M7 17H4v-7h16v7h-3M7 14h10v7H7Z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m14 5 5 5M4 20l3.5-.7L19 7.8a2.1 2.1 0 0 0-3-3L4.7 16.3Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 3h6l1 4H8ZM7 7l1 14h8l1-14M10 11v6M14 11v6"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  </svg>

  <header class="topbar">
    <a class="brand" href="../index.html#/workflow" aria-label="返回 SophiStudio 工作流">
      <img src="../assets/sophistudio-logo.png" alt="SophiStudio">
      <span>项目驾驶舱</span>
    </a>
    <button class="icon-button mobile-menu" id="mobile-menu" type="button" aria-label="展开导航" aria-controls="app-nav" aria-expanded="false">
      <svg><use href="#i-menu"></use></svg>
    </button>
    <a class="back-link" href="../index.html#/workflow">← 返回工作流</a>
    <div class="project-switcher">
      <label class="sr-only" for="project-select">当前项目</label>
      <select id="project-select" aria-label="选择项目"></select>
    </div>
    <div class="top-actions">
      <button class="button button-primary" id="new-project" type="button"><svg><use href="#i-plus"></use></svg>新建项目</button>
      <button class="button button-quiet" id="import-project" type="button"><svg><use href="#i-upload"></use></svg>导入</button>
      <button class="button button-quiet" id="export-project" type="button"><svg><use href="#i-download"></use></svg>导出</button>
      <button class="button button-quiet" id="print-project" type="button"><svg><use href="#i-print"></use></svg>打印</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" id="app-nav" aria-label="项目管理导航">
      <nav>
        <button class="nav-item is-active" type="button" data-view="overview"><svg><use href="#i-home"></use></svg><span>项目总览</span></button>
        <button class="nav-item" type="button" data-view="requirements"><svg><use href="#i-list"></use></svg><span>需求参数</span></button>
        <button class="nav-item" type="button" data-view="gantt"><svg><use href="#i-calendar"></use></svg><span>甘特计划</span></button>
        <button class="nav-item" type="button" data-view="team"><svg><use href="#i-team"></use></svg><span>团队资源</span></button>
        <button class="nav-item" type="button" data-view="bom"><svg><use href="#i-box"></use></svg><span>BOM 与预算</span></button>
        <button class="nav-item" type="button" data-view="acceptance"><svg><use href="#i-check"></use></svg><span>交付验收</span></button>
        <button class="nav-item" type="button" data-view="risks"><svg><use href="#i-alert"></use></svg><span>风险与变更</span></button>
      </nav>
      <div class="sidebar-foot">
        <button class="nav-item nav-danger" id="delete-project" type="button"><svg><use href="#i-trash"></use></svg><span>删除当前项目</span></button>
        <p>本地自动保存<br><span id="last-saved">尚未保存</span></p>
      </div>
    </aside>

    <main class="main-content" id="main-content" tabindex="-1">
      <div class="loading-state">正在加载项目…</div>
    </main>
  </div>

  <dialog class="dialog" id="project-dialog" aria-labelledby="project-dialog-title">
    <form method="dialog" id="project-form">
      <header class="dialog-head">
        <div><h2 id="project-dialog-title">新建项目</h2><p>选择模板后仍可调整全部字段。</p></div>
        <button class="icon-button" type="button" data-close-dialog aria-label="关闭新建项目窗口">×</button>
      </header>
      <div class="dialog-body form-grid">
        <label class="field field-wide"><span>项目名称 *</span><input name="name" required maxlength="60" placeholder="例如：高校线控底盘科研平台"></label>
        <label class="field"><span>项目类型 *</span><select name="type" required><option value="chassis">线控底盘</option><option value="simulator">驾驶模拟器</option></select></label>
        <label class="field"><span>客户</span><input name="customer" maxlength="60" placeholder="待确认"></label>
        <label class="field"><span>项目负责人</span><input name="owner" maxlength="30" placeholder="待确认"></label>
        <label class="field"><span>项目预算（¥）</span><input name="budget" type="number" min="0" step="1000" value="0"></label>
        <label class="field"><span>计划开始</span><input name="startDate" type="date" required></label>
        <label class="field"><span>计划结束</span><input name="endDate" type="date" required></label>
        <label class="field field-wide"><span>项目说明</span><textarea name="description" rows="3" placeholder="项目目标、交付边界和关键背景"></textarea></label>
      </div>
      <footer class="dialog-actions"><button class="button button-quiet" type="button" data-close-dialog>取消</button><button class="button button-primary" value="default" type="submit">创建项目</button></footer>
    </form>
  </dialog>

  <dialog class="dialog dialog-wide" id="record-dialog" aria-labelledby="record-dialog-title">
    <form method="dialog" id="record-form">
      <header class="dialog-head">
        <div><h2 id="record-dialog-title">编辑记录</h2><p id="record-dialog-help">修改后将自动更新项目仪表盘。</p></div>
        <button class="icon-button" type="button" data-close-dialog aria-label="关闭编辑窗口">×</button>
      </header>
      <div class="dialog-body form-grid" id="record-fields"></div>
      <input type="hidden" name="collection">
      <input type="hidden" name="recordId">
      <footer class="dialog-actions"><button class="button button-quiet" type="button" data-close-dialog>取消</button><button class="button button-primary" value="default" type="submit">保存</button></footer>
    </form>
  </dialog>

  <div class="toast-root" id="toast-root" aria-live="polite"></div>

  <script src="prd-core.js?v=20260902-1"></script>
  <script src="prd-data.js?v=20260902-1"></script>
  <script src="prd-app.js?v=20260902-1"></script>
</body>
</html>
